<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Rank Overlay</title>
<style>
  /* The page background stays fully transparent: the native host window paints
     nothing, so whatever this page does NOT draw is the game showing through. */
  :root {
    --panel: rgba(12, 14, 20, 0.74);
    --border: rgba(255, 255, 255, 0.09);
    --ink: #eef1f6;
    --muted: #9aa3b2;
    --blue: #4a90ff;
    --orange: #ff8a3d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    font: 500 11.5px/1.2 "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }

  /* One padded wrapper. Its size is what we report to the host window. */
  #wrap { display: inline-block; padding: 8px; }

  #card {
    display: flex; align-items: stretch; gap: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 6px 9px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(2px);
  }

  #grip {
    width: 10px; flex: 0 0 10px; cursor: move; align-self: stretch;
    border-radius: 6px;
    background:
      radial-gradient(circle, rgba(255,255,255,.35) 1px, transparent 1.4px) 0 0 / 4px 4px;
    opacity: .5;
  }
  #grip:hover { opacity: .9; }

  .team { display: flex; flex-direction: column; gap: 3px; min-width: 126px; }
  .vs { align-self: center; color: var(--muted); font-weight: 700; font-size: 10px; letter-spacing: .5px; padding: 0 1px; }

  .row { display: flex; align-items: center; gap: 6px; }
  .dot { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 5px; }
  .team.blue .dot { background: var(--blue); }
  .team.orange .dot { background: var(--orange); }

  .name { flex: 1 1 auto; max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 7px 1px 3px; border-radius: 999px;
    font-size: 10px; font-weight: 700; white-space: nowrap;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.10);
  }
  .badge .emblem { width: 16px; height: 16px; display: block; flex: 0 0 16px; object-fit: contain; }
  .badge .tier { color: var(--tier, #cfd6e2); }
  .badge .mmr { color: var(--muted); font-weight: 600; }
  .badge.loading, .badge.none { color: var(--muted); }

  .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0; }
  .head b { font-size: 9.5px; letter-spacing: .4px; text-transform: uppercase; }
  .team.blue .head b { color: var(--blue); }
  .team.orange .head b { color: var(--orange); }
  .head .pl { color: var(--muted); font-size: 9px; }
</style>
</head>
<body>
  <div id="wrap"><div id="card"><div id="grip" title="Drag to move"></div></div></div>

<script>
// --- rank emblems -------------------------------------------------------------
// One entry per competitive tier, in the game's order. The emblem is drawn as
// an SVG shield in the tier's colours with the tier numeral inside — original
// art, so the overlay can ship it without touching the game's own icons.
const TIERS = ['Unranked', 'Bronze I', 'Bronze II', 'Bronze III', 'Silver I', 'Silver II', 'Silver III',
  'Gold I', 'Gold II', 'Gold III', 'Platinum I', 'Platinum II', 'Platinum III', 'Diamond I', 'Diamond II',
  'Diamond III', 'Champion I', 'Champion II', 'Champion III', 'Grand Champion I', 'Grand Champion II',
  'Grand Champion III', 'Supersonic Legend'];
// [bright, dark] per tier group: Unranked, Bronze, Silver, Gold, Plat, Diamond, Champ, GC, SSL.
function tierPalette(i) {
  if (i === 0) return ['#8B98A9', '#39424E'];
  if (i <= 3) return ['#C97C4A', '#6E3E22'];
  if (i <= 6) return ['#C7D0DB', '#6E7987'];
  if (i <= 9) return ['#EFC75E', '#8A6E28'];
  if (i <= 12) return ['#7FE3DA', '#29716B'];
  if (i <= 15) return ['#5FB2FF', '#27568F'];
  if (i <= 18) return ['#B08CFF', '#57409A'];
  if (i <= 21) return ['#FF6B6B', '#8F2C2C'];
  return ['#F8F4E3', '#C9A227'];
}
function svgEmblem(i) {
  const c = tierPalette(i);
  const m = TIERS[i].match(/ (I{1,3})$/);
  const label = m ? m[1] : (i === 22 ? 'SSL' : '');
  return '<svg class="emblem" viewBox="0 0 56 56" role="img" aria-label="' + TIERS[i] + '">'
    + '<path d="M28 3 L50 12 V30 C50 42 40 50 28 54 C16 50 6 42 6 30 V12 Z" fill="' + c[1] + '" stroke="' + c[0] + '" stroke-width="2.5"/>'
    + '<path d="M28 9 L44 16 V29 C44 38 37 44 28 47 C19 44 12 38 12 29 V16 Z" fill="none" stroke="' + c[0] + '" stroke-width="1.2" opacity=".55"/>'
    + '<text x="28" y="34" text-anchor="middle" font-size="' + (label === 'SSL' ? 12 : 15) + '" font-weight="800" fill="' + c[0] + '" font-family="Segoe UI,sans-serif">' + label + '</text></svg>';
}
// Which emblem a rank object gets: trust the numeric tier when the service
// sent one, otherwise find the label in the tier list.
function tierIndex(rank) {
  if (rank && Number.isFinite(rank.tier) && rank.tier >= 0 && rank.tier < TIERS.length) return rank.tier;
  const i = TIERS.indexOf(rank && rank.label);
  return i >= 0 ? i : 0;
}
// Real emblem art when the app has an emblems/ folder; shields otherwise.
let USE_EMBLEM_ART = false;
function embFail(el, i) { el.outerHTML = svgEmblem(i); }
function emblemHTML(i) {
  if (!USE_EMBLEM_ART) return svgEmblem(i);
  return '<img class="emblem" src="/emblems/' + TIERS[i].replace(/ /g, '_') + '.png" alt="' + TIERS[i] + '" onerror="embFail(this,' + i + ')">';
}
function tierColor(label) {
  const i = TIERS.indexOf(label);
  return tierPalette(i >= 0 ? i : 0)[0];
}
// Compress "Grand Champion II" -> "GC II" etc. so the badge stays narrow.
function shortLabel(label) {
  if (!label) return '';
  return label
    .replace('Grand Champion', 'GC')
    .replace('Champion', 'Champ')
    .replace('Supersonic Legend', 'SSL')
    .replace('Platinum', 'Plat')
    .replace('Diamond', 'Dia')
    .replace('Bronze', 'Brz')
    .replace('Silver', 'Slv');
}
const PLAYLIST_NAME = { p1: '1v1', p2: '2v2', p3: '3v3', tournaments: 'Tournament' };

const card = document.getElementById('card');
const grip = document.getElementById('grip');

function badge(rank) {
  if (rank === undefined) return '<span class="badge loading">…</span>';
  if (rank === null) return '<span class="badge none">—</span>';
  const i = tierIndex(rank);
  const col = tierPalette(i)[0];
  const mmr = Number.isFinite(rank.mmr) ? '<span class="mmr">' + rank.mmr + '</span>' : '';
  const full = TIERS[i] + (i > 0 && i < 22 && rank.division ? ' · Division ' + rank.division : '');
  return '<span class="badge" style="--tier:' + col + '" title="' + full + '">' + svgEmblem(i) +
    '<span class="tier">' + shortLabel(rank.label) + '</span>' + mmr + '</span>';
}

function teamHtml(players, team, playlistKey) {
  const cls = team === 0 ? 'blue' : 'orange';
  const title = team === 0 ? 'Blue' : 'Orange';
  const rows = players.map(p =>
    '<div class="row"><span class="dot"></span><span class="name">' +
    esc(p.name) + '</span>' + badge(p.rank) + '</div>'
  ).join('');
  const head = '<div class="head"><b>' + title + '</b><span class="pl">' +
    (PLAYLIST_NAME[playlistKey] || '') + '</span></div>';
  return '<div class="team ' + cls + '">' + head + rows + '</div>';
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function render(snap) {
  USE_EMBLEM_ART = !!(snap && snap.emblems);
  const players = (snap && snap.players) || [];
  const blue = players.filter(p => p.team === 0);
  const orange = players.filter(p => p.team === 1);

  // Nothing to show -> tell the host to hide the window (so it never eats clicks).
  if (!players.length) { host('empty'); return; }

  let html = '<div id="grip" title="Drag to move"></div>';
  if (blue.length) html += teamHtml(blue, 0, snap.playlistKey);
  if (blue.length && orange.length) html += '<div class="vs">VS</div>';
  if (orange.length) html += teamHtml(orange, 1, snap.playlistKey);
  card.innerHTML = html;
  bindGrip();
  reportSize();
}

// --- native host bridge (WebView2). Harmless no-ops in a plain browser. --------
function host(msg) { try { window.chrome.webview.postMessage(msg); } catch {} }

let lastSize = '';
function reportSize() {
  const wrap = document.getElementById('wrap');
  const w = Math.ceil(wrap.offsetWidth), h = Math.ceil(wrap.offsetHeight);
  const s = 'size:' + w + ',' + h;
  if (s !== lastSize) { lastSize = s; host(s); }
}
function bindGrip() {
  const g = document.getElementById('grip');
  if (g) g.addEventListener('mousedown', () => host('drag'));
}
bindGrip();

// --- live data ---------------------------------------------------------------
function connect() {
  const es = new EventSource('/events');
  es.onmessage = e => { try { render(JSON.parse(e.data)); } catch {} };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

// Preview mode: open overlay.html?demo in any browser to see the card with
// stand-in data and a faux pitch behind it — no game or server needed.
const DEMO_SNAPSHOT = {
  playlistKey: 'p3', playlistId: 13, feed: 'connected',
  players: [
    { name: 'you', team: 0, rank: { label: 'Champion I', tier: 16, division: 2, mmr: 780 } },
    { name: 'Wayprotein', team: 0, rank: { label: 'Grand Champion I', tier: 19, division: 1, mmr: 1005 } },
    { name: 'Kevpert', team: 0, rank: { label: 'Diamond III', tier: 15, division: 4, mmr: 690 } },
    { name: 'Sublime', team: 1, rank: { label: 'Grand Champion II', tier: 20, division: 3, mmr: 1120 } },
    { name: 'noobslayer', team: 1, rank: { label: 'Platinum II', tier: 11, division: 1, mmr: 540 } },
    { name: 'ssl_smurf', team: 1, rank: { label: 'Supersonic Legend', tier: 22, division: 1, mmr: 1460 } }
  ]
};
if (new URLSearchParams(location.search).has('demo')) {
  document.body.style.background = 'linear-gradient(135deg,#123a22 0%,#0a2140 55%,#3a1420 100%)';
  document.body.style.display = 'grid';
  document.body.style.placeItems = 'center';
  document.body.style.minHeight = '100vh';
  render(DEMO_SNAPSHOT);
} else {
  connect();
}

// The host window clamps itself onto the screen, so the card keeps its
// side-by-side layout and never wraps into a tall stack.
window.addEventListener('resize', reportSize);
</script>
</body>
</html>
